<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Employee Attendance System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="glass-card p-4 p-md-5 shadow-lg border-0">
                    <div class="text-center mb-4">
                        <div class="metric-icon metric-icon-purple mx-auto mb-3 shadow">
                            <i class="fa-solid fa-user-lock text-primary fs-3"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">System Authentication</h3>
                        <p class="text-muted fs-7">Enter your Credentials to access your Workspace</p>
                    </div>

                    <!-- Role Switcher Pills -->
                    <ul class="nav nav-pills nav-justified mb-4 bg-light p-1 rounded-pill" id="roleTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-semibold rounded-pill" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-panel" type="button" role="tab"><i class="fa-solid fa-user-shield me-1"></i> Admin</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-semibold rounded-pill" id="employee-tab" data-bs-toggle="tab" data-bs-target="#employee-panel" type="button" role="tab"><i class="fa-solid fa-id-badge me-1"></i> Employee</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="roleTabContent">
                        <!-- Admin Form -->
                        <div class="tab-pane fade show active" id="admin-panel" role="tabpanel">
                            <form id="adminLoginForm">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold fs-7 text-dark">Admin ID</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="fa-solid fa-user text-primary"></i></span>
                                        <input type="text" id="adminId" class="form-control" value="ADMIN001" required placeholder="ADMIN001">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold fs-7 text-dark">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="fa-solid fa-key text-primary"></i></span>
                                        <input type="password" id="adminPassword" class="form-control" value="Admin@123" required>
                                    </div>
                                </div>
                                <div class="mb-3 d-flex justify-content-between align-items-center">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="rememberAdmin" checked>
                                        <label class="form-check-label fs-7" for="rememberAdmin">Remember me</label>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm rounded-pill">
                                    Sign In as Administrator <i class="fa-solid fa-right-to-bracket ms-2"></i>
                                </button>
                            </form>
                        </div>

                        <!-- Employee Form -->
                        <div class="tab-pane fade" id="employee-panel" role="tabpanel">
                            <form id="empLoginForm">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold fs-7 text-dark">Employee ID</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="fa-solid fa-id-card text-primary"></i></span>
                                        <input type="text" id="empId" class="form-control" value="EMP001" required placeholder="EMP001">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold fs-7 text-dark">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="fa-solid fa-key text-primary"></i></span>
                                        <input type="password" id="empPassword" class="form-control" value="Emp@123" required>
                                    </div>
                                </div>
                                <div class="mb-3 d-flex justify-content-between align-items-center">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="rememberEmp" checked>
                                        <label class="form-check-label fs-7" for="rememberEmp">Remember me</label>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm rounded-pill">
                                    Sign In as Employee <i class="fa-solid fa-right-to-bracket ms-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Preset Demo Helper -->
                    <div class="mt-4 pt-3 border-top text-center fs-7">
                        <span class="text-muted">Need a quick demo? Click below to fill:</span>
                        <div class="d-flex gap-2 justify-content-center mt-2">
                            <button type="button" onclick="quickFill('ADMIN001', 'Admin@123', 'admin')" class="btn btn-sm btn-outline-primary rounded-pill">Fill Admin Credentials</button>
                            <button type="button" onclick="quickFill('EMP001', 'Emp@123', 'employee')" class="btn btn-sm btn-outline-primary rounded-pill">Fill Employee Credentials</button>
                        </div>
                    </div>

                </div>
                <div class="text-center mt-3 text-muted fs-7">
                    <a href="index.html" class="text-decoration-none text-primary fw-semibold"><i class="fa-solid fa-arrow-left me-1"></i> Back to Homepage</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function quickFill(id, pwd, role) {
            if (role === 'admin') {
                document.getElementById('admin-tab').click();
                document.getElementById('adminId').value = id;
                document.getElementById('adminPassword').value = pwd;
            } else {
                document.getElementById('employee-tab').click();
                document.getElementById('empId').value = id;
                document.getElementById('empPassword').value = pwd;
            }
        }

        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('adminId').value.trim();
            const pwd = document.getElementById('adminPassword').value.trim();
            const user = store.getEmployeeById(id);

            if (user && user.role === 'admin' && user.passwordHash === pwd) {
                store.setCurrentUser(user);
                showToast('Authentication Successful. Redirecting to Admin Console...', 'success');
                setTimeout(() => window.location.href = 'admin-dashboard.html', 500);
            } else {
                showToast('Invalid Admin ID or Password! Default: ADMIN001 / Admin@123', 'error');
            }
        });

        document.getElementById('empLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('empId').value.trim();
            const pwd = document.getElementById('empPassword').value.trim();
            const user = store.getEmployeeById(id);

            if (user && user.role === 'employee' && user.passwordHash === pwd) {
                store.setCurrentUser(user);
                showToast('Welcome back ' + user.name + '. Redirecting to Workspace...', 'success');
                setTimeout(() => window.location.href = 'employee-dashboard.html', 500);
            } else if (user && user.role === 'admin') {
                showToast('This account is an Administrator. Please use the Admin tab.', 'warning');
            } else {
                showToast('Invalid Employee ID or Password! Default: EMP001 / Emp@123', 'error');
            }
        });
    </script>
</body>
</html>
